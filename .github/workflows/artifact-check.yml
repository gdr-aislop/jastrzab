name: Artifact check (temporary)

# Throw-away: exercises, with the new upload-artifact/download-artifact majors, exactly the upload
# and download patterns the tag-only jobs of release.yml use. Removed before merging.

on:
  push:
    branches: ["claude/**"]

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -eu
          for arch in arm64 amd64; do mkdir -p up/deb-$arch; echo "deb $arch" > up/deb-$arch/jastrzab_$arch.deb; echo "sum" > up/deb-$arch/SHA256SUMS-$arch.txt; done
          mkdir -p up/appimage-x86_64 up/flatpak-x86_64 up/flatpak-aarch64
          echo a > up/appimage-x86_64/j.AppImage; echo z > up/appimage-x86_64/j.AppImage.zsync
          echo f > up/flatpak-x86_64/j-x86_64.flatpak; echo f > up/flatpak-aarch64/j-aarch64.flatpak
          for arch in x86_64 aarch64; do mkdir -p up/ostree-$arch/objects/ab up/ostree-$arch/refs/heads; echo o > up/ostree-$arch/objects/ab/cd.file; echo r > up/ostree-$arch/refs/heads/$arch; echo cfg > up/ostree-$arch/config; done
          mkdir -p up/pages/objects up/apt/dists/stable; echo p > up/pages/index.flatpakrepo; echo i > up/apt/dists/stable/InRelease
      - uses: actions/upload-artifact@v7
        with: { name: deb-arm64, path: up/deb-arm64/*, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: deb-amd64, path: up/deb-amd64/*, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-x86_64
          path: |
            up/appimage-x86_64/*.AppImage
            up/appimage-x86_64/*.zsync
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with: { name: flatpak-x86_64, path: up/flatpak-x86_64/*, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: flatpak-aarch64, path: up/flatpak-aarch64/*, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: flatpak-ostree-x86_64, path: up/ostree-x86_64, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: flatpak-ostree-aarch64, path: up/ostree-aarch64, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: flatpak-pages, path: up/pages, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: apt-repo, path: up/apt, if-no-files-found: error }

  download:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      # combine-flatpak-repo
      - uses: actions/download-artifact@v8
        with: { pattern: "flatpak-ostree-*", path: flatpak-repos }
      # build-apt-repo
      - uses: actions/download-artifact@v8
        with: { pattern: "deb-*", path: debs }
      # deploy-pages
      - uses: actions/download-artifact@v8
        with: { name: flatpak-pages, path: pages }
      - uses: actions/download-artifact@v8
        with: { name: apt-repo, path: pages/apt }
      # release
      - uses: actions/download-artifact@v8
        with:
          pattern: "{deb-*,appimage-*,flatpak-x86_64,flatpak-aarch64}"
          merge-multiple: true
          path: dist
      - name: The layouts release.yml relies on
        run: |
          set -eu
          find . -type f -not -path "./.git/*" | sort
          test -f flatpak-repos/flatpak-ostree-x86_64/objects/ab/cd.file
          test -f flatpak-repos/flatpak-ostree-aarch64/refs/heads/aarch64
          test -f flatpak-repos/flatpak-ostree-x86_64/config
          test -f debs/deb-arm64/jastrzab_arm64.deb
          test -f debs/deb-amd64/jastrzab_amd64.deb
          test -f pages/index.flatpakrepo
          test -f pages/apt/dists/stable/InRelease
          for f in jastrzab_arm64.deb jastrzab_amd64.deb j.AppImage j.AppImage.zsync j-x86_64.flatpak j-aarch64.flatpak SHA256SUMS-arm64.txt SHA256SUMS-amd64.txt; do test -f dist/$f; done
          ! ls dist | grep -E "objects|refs|config|InRelease|index.flatpakrepo"
          echo "layouts as expected"
