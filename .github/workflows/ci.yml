name: CI

# Builds and tests inside debian:bookworm, Crimson's base, so the code is compiled against GTK 4.8,
# libadwaita 1.2 and libsoup 3.2: using a newer API than the phone has fails the build here instead
# of crashing on the device.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates gettext \
            libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev libsecret-1-dev \
            glib-networking nodejs

      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal -c rustfmt -c clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      # The end-to-end encryption must decrypt in the web viewer's own WebCrypto calls.
      - name: Encryption interoperability with the web viewer (Node WebCrypto)
        run: |
          set -eu
          cargo run -q --locked -p hauk --example seal_post | node crates/hauk/tests/interop/webcrypto-open.mjs

  live-server:
    name: protocol against a real Hauk backend
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates \
            php-cli php-redis redis-server

      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Start a Hauk backend
        run: |
          set -eux
          git clone --depth 1 --branch 1.6.3 https://github.com/bilde2910/Hauk /tmp/hauk
          cd /tmp/hauk/backend-php
          hash="$(php -r 'echo password_hash("testpw", PASSWORD_BCRYPT);')"
          sed -e 's/"storage_backend"       => MEMCACHED/"storage_backend"       => REDIS/' \
              -e "s#'\$2y\$10\$[^']*'#'$hash'#" \
              -e "s#'https://example.com/'#'http://127.0.0.1:8080/'#" \
              include/config-sample.php > include/config.php
          redis-server --daemonize yes --save "" --appendonly no
          nohup php -S 127.0.0.1:8080 -t /tmp/hauk/backend-php > /tmp/php.log 2>&1 &
          sleep 2
          curl -sf -X POST -d 'pwd=testpw&dur=60&int=5&e2e=0&mod=0&ado=1' http://127.0.0.1:8080/api/create.php | head -1

      - name: Run the protocol tests against it
        env:
          HAUK_TEST_URL: http://127.0.0.1:8080/
          HAUK_TEST_PASSWORD: testpw
        run: cargo test --locked -p hauk --test live_server -- --ignored
