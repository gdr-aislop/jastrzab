name: Release debs

# Builds the .deb for every release tag:
#   - arm64: PureOS Crimson on the Librem 5 (built against Debian bookworm libraries, Crimson's
#     base: the same libgtk-4 4.8 / libadwaita 1.2 the feature caps in Cargo.toml target)
#   - amd64: a test build; Ubuntu 24.04's GTK and libadwaita are newer than the floor, so the same
#     deb installs and runs there
# Both build inside a debian:bookworm container so the binaries link against Crimson-era library
# versions, and so accidentally using a newer-than-4.8/1.2 API fails the build.
#
# Like the author's other Phosh app this could also ship an AppImage, a Flatpak and a signed APT
# repo; those need signing keys and are not set up yet.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-deb:
    name: Build .deb (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    container:
      image: debian:bookworm

    steps:
      - uses: actions/checkout@v4

      # Fails fast: a tag push with a Cargo.toml nobody bumped would otherwise ship a mislabelled
      # .deb. Skipped for workflow_dispatch dry runs.
      - name: Verify the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $tag_version) does not match the workspace version $cargo_version in Cargo.toml: bump [workspace.package].version before tagging a release."
            exit 1
          fi

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates gettext \
            libgtk-4-dev libadwaita-1-dev libsoup-3.0-dev libsecret-1-dev

      # The workspace is owned by the runner's user, not root: `build.rs` runs `git rev-parse`.
      - name: Mark the workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb -p jastrzab

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp -v target/debian/./*.deb dist/
          cd dist
          sha256sum ./*.deb > "SHA256SUMS-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Attach the debs to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb]
    runs-on: ubuntu-latest
    # Only this job needs write access.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "deb-*"
          merge-multiple: true
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.deb > SHA256SUMS
          rm -f SHA256SUMS-*.txt
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
