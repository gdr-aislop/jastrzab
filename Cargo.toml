[workspace]
resolver = "2"
members = ["crates/hauk", "crates/jastrzab-core", "app"]
default-members = ["crates/hauk", "crates/jastrzab-core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/gdr-aislop/jastrzab"

[workspace.dependencies]
# --- UI. Capped at PureOS Crimson (GTK 4.8.3, libadwaita 1.2.2, GLib 2.74): the version features
# below make system-deps refuse to build against anything older, and keep newer API out.
gtk = { package = "gtk4", version = "0.11", features = ["gnome_43"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_2"] }
glib = "0.22"
gio = "0.22"
soup3 = "0.9"
libsecret = { version = "0.9", features = ["v0_20"] }
# --- Protocol / crypto (pure Rust, no OpenSSL link)
pbkdf2 = "0.13"
hmac = "0.13"
sha1 = "0.11"
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
base64 = "0.22"
getrandom = "0.4"
form_urlencoded = "1"
# --- Plumbing
async-channel = "2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1.1"
directories = "5"
tempfile = "3"
# Logging and crash reporting: the same set audiobooklet uses.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
crash-handler = "0.8"
minidumper = "0.11"
gettext-rs = { package = "gettext-rs", version = "0.7", features = ["gettext-system"] }

hauk = { path = "crates/hauk" }
jastrzab-core = { path = "crates/jastrzab-core" }
